  short_description: "语雀统一入口：搜索、阅读、总结、记录想法和整理个人知识库"
  brand_color: "#25B864"
  default_prompt: "使用 $yuque 搜索、阅读或整理我的语雀知识库。"

dependencies:
  tools:
